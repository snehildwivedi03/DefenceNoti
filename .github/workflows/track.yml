name: Defence Notification Tracker

on:
  schedule:
    # Twice daily (UTC). 01:30 UTC = 07:00 IST, 12:30 UTC = 18:00 IST.
    - cron: '30 1 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: GovNoti
        run: npm ci || npm install

      - name: Run tracker
        working-directory: GovNoti
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: npm run track

      - name: Commit pruned state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GovNoti/public/data/notifications.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update notifications state [skip ci]"
            git push
          fi
